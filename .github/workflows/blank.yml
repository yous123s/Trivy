name: Trivy to DefectDojo

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:

      # 1. Scan nginx image with Trivy
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: nginx:latest
          format: json
          output: trivy-report.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

      # 2. Verify the generated report
      - name: Verify Trivy Report
        run: |
          ls -lh trivy-report.json
          test -s trivy-report.json

      # 3. Upload Trivy report to DefectDojo
      - name: Upload report to DefectDojo
        if: always()
        run: |
          curl --fail-with-body \
            -X POST \
            "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=Trivy Scan" \
            -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
            -F "file=@trivy-report.json"
